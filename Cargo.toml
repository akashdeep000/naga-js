[package]
edition = "2021"
name = "naga_js"
# Tracks the wrapped naga version (see scripts/sync-version.mjs).
version = "30.0.1"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-derive = "3.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.naga]
version = "30"
features = [
  "wgsl-in",
  "wgsl-out",
  "glsl-in",
  "glsl-out",
  "spv-in",
  "spv-out",
  "hlsl-out",
  "msl-out",
  "dot-out",
]

[dependencies.napi]
version = "3.0.0"
features = ["napi4", "serde-json"]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
