name: CI
env:
  DEBUG: napi:*
  APP_NAME: naga-js
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
permissions:
  contents: write
  id-token: write
'on':
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install dependencies
        run: pnpm install
      - name: ESLint
        run: pnpm lint
      - name: Version sync check
        # package.json version must equal the resolved naga version (lockstep).
        run: node scripts/sync-version.mjs --check
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm build --target x86_64-apple-darwin
          - host: windows-latest
            build: pnpm build --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            build: pnpm build --target i686-pc-windows-msvc
            target: i686-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm build --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: pnpm build --target x86_64-unknown-linux-musl -x
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: pnpm build --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            build: pnpm build --target armv7-unknown-linux-gnueabihf --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-linux-android
            build: pnpm build --target aarch64-linux-android
          - host: ubuntu-latest
            target: armv7-linux-androideabi
            build: pnpm build --target armv7-linux-androideabi
          - host: ubuntu-latest
            target: x86_64-linux-android
            build: pnpm build --target x86_64-linux-android
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: pnpm build --target aarch64-unknown-linux-musl -x
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build --target aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-freebsd
            build: pnpm build --target x86_64-unknown-freebsd -x
          - host: ubuntu-latest
            target: wasm32-wasip1-threads
            build: pnpm build --target wasm32-wasip1-threads
    name: stable - ${{ matrix.settings.target }} - node@22
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') || contains(matrix.settings.target, 'freebsd') }}
        with:
          version: 0.15.2
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') || contains(matrix.settings.target, 'freebsd') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      - name: Setup Android x86_64 NDK toolchain
        # The CLI only wires NDK linkers for arm64/armv7 Android; x86_64 is an
        # accepted triple without toolchain setup, so mirror the CLI's exact
        # convention (API 24, `<arch>-linux-android24-clang`) manually.
        # Keep in sync with setAndroidEnv() in @napi-rs/cli.
        if: matrix.settings.target == 'x86_64-linux-android'
        run: |
          TC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TC/x86_64-linux-android24-clang" || { echo "missing NDK x86_64 clang in $TC"; exit 1; }
          {
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$TC/x86_64-linux-android24-clang"
            echo "TARGET_CC=$TC/x86_64-linux-android24-clang"
            echo "TARGET_CXX=$TC/x86_64-linux-android24-clang++"
            echo "TARGET_AR=$TC/llvm-ar"
            echo "TARGET_RANLIB=$TC/llvm-ranlib"
            echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME"
            echo "$TC" >> "$GITHUB_PATH"
          } >> "$GITHUB_ENV"
        shell: bash
      - name: Install dependencies
        run: pnpm install
      - name: Setup node x86
        uses: actions/setup-node@v7
        if: matrix.settings.target == 'i686-pc-windows-msvc'
        with:
          node-version: 22
          cache: pnpm
          architecture: x86
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: ${{ !startsWith(matrix.settings.target, 'wasm32-') }}
        with:
          name: bindings-${{ matrix.settings.target }}
          path: '*.node'
          if-no-files-found: error
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: ${{ startsWith(matrix.settings.target, 'wasm32-') }}
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |-
            *.wasm
            index.js
            browser.js
            *.wasi*.cjs
            *.wasi*.d.cts
            *.wasi*-browser.js
            *.wasi*-deferred.js
            *.wasi*-deferred.d.ts
            wasi-worker*.mjs
          if-no-files-found: error
  test-freebsd:
    runs-on: ubuntu-latest
    name: Test FreeBSD binding
    needs:
      - build
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-x86_64-unknown-freebsd
          path: .
      - name: Start VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: freebsd
          version: '15.1'
          shell: bash
          memory: 8G
          cpu_count: 3
      - name: Test
        id: test
        shell: cpa.sh {0} --environment-variables DEBUG
        env:
          DEBUG: napi:*
        run: |
          sudo pkg install -y -f node libnghttp2
          echo "~~~~ node -v ~~~~"
          node -v
          pwd
          ls -lah
          whoami
          freebsd-version
          node simple-test.js
          node -e "require('./index.js')"
  test-macOS-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
        node:
          - '22'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          architecture: ${{ matrix.settings.architecture }}
      - name: Install dependencies
        run: pnpm install --force
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: pnpm test
  test-linux-binding:
    name: Test ${{ matrix.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-gnueabihf
        node:
          - '22'
    runs-on: ${{ contains(matrix.target, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Output docker params
        id: docker
        run: |
          node -e "
            if ('${{ matrix.target }}'.startsWith('aarch64')) {
              console.log('PLATFORM=linux/arm64')
            } else if ('${{ matrix.target }}'.startsWith('armv7')) {
              console.log('PLATFORM=linux/arm/v7')
            } else {
              console.log('PLATFORM=linux/amd64')
            }
          " >> $GITHUB_OUTPUT
          node -e "
            if ('${{ matrix.target }}'.endsWith('-musl')) {
              console.log('IMAGE=node:${{ matrix.node }}-alpine')
            } else {
              console.log('IMAGE=node:${{ matrix.node }}-slim')
            }
          " >> $GITHUB_OUTPUT
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Install dependencies
        run: pnpm install --force
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        if: ${{ contains(matrix.target, 'armv7') }}
        with:
          platforms: all
      - run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
        if: ${{ contains(matrix.target, 'armv7') }}
      - name: Test bindings
        uses: tj-actions/docker-run@v2
        with:
          image: ${{ steps.docker.outputs.IMAGE }}
          name: test-binding
          options: -v ${{ steps.docker.outputs.PNPM_STORE_PATH }}:${{ steps.docker.outputs.PNPM_STORE_PATH }} -v ${{ github.workspace }}:${{ github.workspace }} -w ${{ github.workspace }} --platform ${{ steps.docker.outputs.PLATFORM }}
          args: npm run test
  test-wasi:
    name: Test WASI target
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-wasm32-wasip1-threads
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Assert no native artifact leaked in
        # `NAPI_RS_FORCE_WASI=true` (not `error`) because the ava TS loader
        # (@oxc-node/core, itself a napi package) honors the same env var and
        # has no WASI build — `error` would fail the runner, not our code.
        # The rigor `error` used to provide comes from this step instead: with
        # no `.node` file present, only the WASM artifact can satisfy the load.
        run: |
          if ls *.node 2>/dev/null; then
            echo "native artifact present in WASI job — refusing silent native test"
            exit 1
          fi
          ls *.wasm *.wasi.cjs
        shell: bash
      - name: Test bindings
        run: pnpm test
        env:
          NAPI_RS_FORCE_WASI: 'true'
  test-bun:
    name: Test bindings on Bun
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      # Node is still required: pnpm itself runs on Node. The suite below
      # executes entirely on the Bun runtime.
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        # Pinned to the version the suite is verified against (22/22 locally).
        # Bump deliberately and re-verify; upstream treats Bun as best-effort.
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: pnpm install --force
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Bun version
        run: bun --version
      - name: Test bindings under Bun
        run: bunx ava
      - name: Smoke test CJS loader under Bun
        run: bun simple-test.js
  test-android:
    name: Test Android bindings (experimental)
    needs:
      - build
    # Experimental by design, signal only, never gates publishing. Node.js
    # ships no official Android build, so the test runs on a Termux-provided
    # Node (see the script header). The x86_64 target is tested because the
    # emulator has no Linux-ARM64 host build — an ARM runner cannot boot any
    # emulator at all. The arm64/armv7 artifacts stay build-verified.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-x86_64-linux-android
          path: android-binding
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install emulator system libraries
        # The stock runner image lacks libpulse, which the SDK emulator's
        # qemu links against even with -no-audio (boot fails with
        # "libpulse.so.0: cannot open shared object file"). Ubuntu 24.04
        # renamed the package with a t64 suffix; fall back to the old name.
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0t64 || sudo apt-get install -y libpulse0
        shell: bash
      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TERMUX_ARCH: x86_64
          BINDING_DIR: android-binding
        with:
          api-level: 29
          # `default` (no Google APIs): smaller image, faster boot. The smoke
          # test only needs a shell plus the Termux-provided node binary.
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Tuned for software emulation (`-accel off` on runners without
          # KVM): 2 GB guest (4 GB starves the host emulator process),
          # software GL (no GPU on the runner), no snapshot churn.
          emulator-options: -no-window -no-snapshot -no-snapshot-save -no-audio -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          script: .github/scripts/test-android.sh
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - lint
      - test-freebsd
      - test-macOS-windows-binding
      - test-linux-binding
      - test-bun
      - test-wasi
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: create npm dirs
        run: pnpm napi create-npm-dirs
      - name: Move artifacts
        run: pnpm artifacts
      - name: Artifact completeness gate
        # napi-rs only warns (and continues) on missing target files, so this
        # explicit gate is what blocks a partial release from publishing.
        run: node scripts/check-artifacts.mjs ./npm
        shell: bash
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: Publish
        run: |
          npm config set provenance true
          if git log -1 --pretty=%B | grep "^v\?[0-9]\+\.[0-9]\+\.[0-9]\+$";
          then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
            npm publish --access public
          elif git log -1 --pretty=%B | grep "^v\?[0-9]\+\.[0-9]\+\.[0-9]\+";
          then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
            npm publish --tag next --access public
          else
            echo "Not a release, skipping publish"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
